<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gassenplan</title>
<style>
  :root { color-scheme: light dark; --bg: #edf0f3; --ink: #17202a; --muted: #5d6976; --mark: #f2b705; }
  @media (prefers-color-scheme: dark) { :root { --bg: #11151a; --ink: #e8ebef; --muted: #9aa5b1; --mark: #f5c22e; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
         font: 16px/1.5 system-ui, -apple-system, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  a { display: inline-block; margin-top: 14px; padding: 12px 20px; border-radius: 12px; background: var(--mark); color: #1b2129; font-weight: 700; text-decoration: none; }
  p { color: var(--muted); margin: 6px 0 0; }
</style>
</head>
<body>
<div>
  <b>Der Entwurf ist jetzt der normale Gassenplan.</b>
  <p>Dieses Symbol auf dem Home-Bildschirm kannst du löschen.</p>
  <a href="../">Zum Gassenplan</a>
</div>
<script>
  // Entwurf-Speicher aufräumen und zum normalen Gassenplan wechseln
  (async () => {
    try {
      const reg = await navigator.serviceWorker?.getRegistration('./');
      if (reg && new URL(reg.scope).pathname.endsWith('/entwurf/')) await reg.unregister();
      for (const k of await caches.keys()) if (k.startsWith('gassenplan-entwurf-')) await caches.delete(k);
    } catch (_) {}
    setTimeout(() => location.replace('../'), 1500);
  })();
</script>
</body>
</html>
